    tracking_code:
      required: true
      example: "0000100000100000000000"
      selector:
        text:
    postal_code:
      required: false
      example: "28001"
      selector:
        text:
    contents:
      required: false
      example: "Running shoes"
      selector:
        text:

untrack_parcel:
  fields:
    tracking_code:
      required: true
      example: "0000100000100000000000"
      selector:
        text:

update_contents:
  fields:
    tracking_code:
      required: true
      example: "0000100000100000000000"
      selector:
        text:
    contents:
      required: false
      example: "Running shoes"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tipsa
